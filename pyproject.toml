[project]
name = "project-memory"
version = "0.1.0"
description = "Cross-project session memory for developers who work across many repos."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tyrone May", email = "1959192+mayhemds@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["memory", "cli", "developer-tools", "ai", "session-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "anthropic>=0.40",
    "platformdirs>=4.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mem = "project_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_memory"]

# -- Ruff ----------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long - handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["project_memory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -- mypy ----------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

# -- pytest --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "integration: marks tests that call real external services (deselect with '-m not integration')",
]

# -- coverage ------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
